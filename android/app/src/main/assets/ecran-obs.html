:root { --or2: #F6D68A; --blanc: #F7F4EC; --brume2: #7F8AB8; --serif: 'Literata', Georgia, 'Times New Roman', serif; --sans: 'Atkinson', 'Segoe UI', system-ui, sans-serif; }
* { box-sizing: border-box; }
</style>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; cursor: none; }
  body { font-size: calc(100vh / 108); color: var(--blanc); font-family: var(--serif); }
  #fond { position: fixed; inset: 0; transition: opacity .6s; }
  .theme-nuit #fond { background: radial-gradient(120% 90% at 50% 10%, #22306A 0%, #10183A 45%, #050817 100%); }
  .theme-noir #fond { background: #000; }
  .theme-aube #fond { background: radial-gradient(110% 90% at 50% 100%, #5A3A12 0%, #2A1A0A 45%, #0A0604 100%); }
  .theme-vert #fond { background: #00B140; }
  .theme-transparent #fond { background: transparent; }
  /* rien à l'écran (Retirer) : tout devient transparent, comme à opacité 0 → OBS montre la caméra, le projecteur est noir */
  .mode-vide #fond { opacity: 0; }
  html.obs, html.obs body { background: transparent; }
  html.obs #msg { display: none; }
  #scene { position: fixed; inset: 6vh 7vw; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; transition: opacity .45s ease; }
  #scene.cache { opacity: 0; }
  #texte { font-size: 6rem; line-height: 1.32; max-width: 100%; text-wrap: balance; text-shadow: 0 .3rem 1.6rem rgba(0,0,0,.55); }
  #texte .ligne { display: block; }
  /* 2e version (bilingue) : sous le texte, plus petite */
  #texte2 { margin-top: 2.2rem; max-width: 100%; font-style: italic; line-height: 1.3; opacity: .86; text-wrap: balance; text-shadow: 0 .3rem 1.6rem rgba(0,0,0,.55); }
  #texte2:empty { display: none; }
  #ref { margin-top: 3.2rem; font-family: var(--sans); font-weight: 700; font-size: 3.2rem; letter-spacing: .04em; color: var(--or2); }
  #ref:empty { display: none; }
  .mode-verset #texte { font-style: normal; }
  .mode-chant #texte { font-family: var(--sans); font-weight: 700; line-height: 1.25; }
  /* bandeau : texte en bas de l'écran (pratique avec le fond vert) */
  .pres-bandeau #scene { inset: auto 5vw 5vh 5vw; height: 30vh; justify-content: center; background: rgba(10,16,40,.88); border-radius: 2rem; padding: 3vh 4vw; box-shadow: 0 1rem 4rem rgba(0,0,0,.5); }
  .pres-bandeau #ref { margin-top: 1.4rem; font-size: 2.6rem; }
  #msg { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); font: 2.4rem var(--sans); color: var(--brume2); opacity: .7; cursor: default; text-align: center; }
  body.vivant #msg { display: none; }
</style>
</head>
<body class="theme-nuit">
<div id="fond"></div>
<div id="scene" class="cache"><div id="texte"></div><div id="texte2"></div><div id="ref"></div></div>
<script>
const scene = document.getElementById('scene'), texte = document.getElementById('texte'), texte2 = document.getElementById('texte2'), refEl = document.getElementById('ref');
let courant = null;
function ajuster() {
  // plus grande taille qui tient dans l'écran
  let lo = 2, hi = 11, best = 2;
  const maxH = scene.clientHeight - (refEl.textContent ? refEl.offsetHeight + 40 : 0);
  const avec2 = !!texte2.textContent;
  const taille = (r) => { texte.style.fontSize = r + 'rem'; if (avec2) texte2.style.fontSize = (r * 0.68) + 'rem'; };
  for (let i = 0; i < 14; i++) {
    const mid = (lo + hi) / 2;
    taille(mid);
    const haut = avec2 ? texte.scrollHeight + texte2.scrollHeight + texte2.offsetTop - (texte.offsetTop + texte.offsetHeight) : texte.scrollHeight;
    if (haut <= maxH + 2 && texte.scrollWidth <= scene.clientWidth + 2 && (!avec2 || texte2.scrollWidth <= scene.clientWidth + 2)) { best = mid; lo = mid; } else hi = mid;
  }
  taille(best);
}
function afficher(e) {
  document.body.className = 'theme-' + (e.theme || 'nuit') + ' vivant mode-' + (e.mode || 'vide') + ' pres-' + (e.presentation || 'plein');
  const vide = !e.mode || e.mode === 'vide';
  const deux = e.mode === 'verset' && e.second && e.second.texte ? e.second.texte : '';
  const cle = JSON.stringify([e.mode, e.lignes, e.ref, e.taille, e.presentation, deux]);
  if (cle === courant) return;
  const avant = courant;
  courant = cle;
  scene.classList.add('cache');
  setTimeout(() => {
    texte.textContent = '';
    for (const l of e.lignes || []) { const s = document.createElement('span'); s.className = 'ligne'; s.textContent = l; texte.appendChild(s); }
    texte2.textContent = deux;
    refEl.textContent = e.ref || '';
    ajuster();
    if (e.taille) { texte.style.fontSize = (parseFloat(texte.style.fontSize) * e.taille) + 'rem'; if (deux) texte2.style.fontSize = (parseFloat(texte2.style.fontSize) * e.taille) + 'rem'; }
    if (!vide) scene.classList.remove('cache');
  }, avant && !vide ? 380 : 0);
}
// page créée par le téléphone (MyVerse fermé sur le PC) : état de départ inclus, puis événements « myverse » d'OBS
window.addEventListener('myverse', (ev) => { if (ev.detail) afficher(ev.detail); });
window.addEventListener('resize', () => { if (courant) ajuster(); });
const ETAT_INITIAL = /*ETAT*/null;
if (ETAT_INITIAL) afficher(ETAT_INITIAL);
