name: Outil temporaire (paquets NuGet)
on:
  push:
    branches: [outil-paquets]
permissions:
  contents: write
jobs:
  paquets:
    if: "!contains(github.event.head_commit.message, '[paquets]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: SDK WPF (Microsoft.NET.Sdk.WindowsDesktop) dans la branche
        run: |
          dotnet --list-sdks
          SDK=$(dotnet --list-sdks | grep '^8\.' | tail -1 | sed -E 's/^([^ ]+) \[(.*)\]$/\2\/\1/')
          echo "$SDK"
          ls "$SDK/Sdks"
          rm -f outil/paquets.tgz.part-*
          tar -C "$SDK/Sdks" -czf outil/sdk-wpf.tgz Microsoft.NET.Sdk.WindowsDesktop
          ls -la outil/sdk-wpf.tgz
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A outil
          git commit -m "[paquets] SDK WPF (outil temporaire)"
          git push
