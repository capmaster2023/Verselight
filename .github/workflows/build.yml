name: Build MyVerse

on:
  push:
    branches: [main, dev]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    name: MyVerse Windows (natif)
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    env:
      DOTNET_NOLOGO: '1'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
    steps:
      - uses: actions/checkout@v4

      - name: Version
        id: v
        run: |
          $v = (Get-Content VERSION -Raw).Trim()
          if ($env:GITHUB_REF -like 'refs/tags/v*') { $v = $env:GITHUB_REF.Substring(11) }
          "version=$v" >> $env:GITHUB_OUTPUT

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Tests du cœur (Bible, recherche, chants, téléphone)
        run: |
          New-Item -ItemType Directory -Force ci | Out-Null
          dotnet run --project windows/MyVerse.Tests -c Release -- "$PWD/windows/MyVerse/Ressources" 2>&1 | Tee-Object -FilePath ci/tests.log
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Compilation de MyVerse.exe
        run: |
          dotnet publish windows/MyVerse/MyVerse.csproj -c Release -r win-x64 --self-contained true -p:PublishReadyToRun=true -p:Version=${{ steps.v.outputs.version }} -o out/MyVerse -v:m 2>&1 | Tee-Object -FilePath ci/windows-build.log
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Copy-Item windows/LISEZ-MOI.txt out/MyVerse/
          Get-ChildItem out/MyVerse | Measure-Object -Property Length -Sum | ForEach-Object { "{0} fichiers, {1:N1} Mo" -f $_.Count, ($_.Sum / 1MB) }

      - name: Test automatique (fenêtres, projection, captures d'écran)
        run: |
          $env:VERSELIGHT_DATA_DIR = "$env:RUNNER_TEMP\myverse-donnees"
          New-Item -ItemType Directory -Force ci/autotest | Out-Null
          $p = Start-Process -FilePath "out\MyVerse\MyVerse.exe" -ArgumentList @("--autotest", "$PWD\ci\autotest") -PassThru
          $null = $p.Handle
          if (-not $p.WaitForExit(300000)) { $p.Kill(); "MyVerse ne s'est pas fermé (plus de 5 minutes)" | Tee-Object -FilePath ci/autotest/autotest.txt -Append; exit 1 }
          Get-Content ci/autotest/autotest.txt -ErrorAction SilentlyContinue
          "code de sortie : $($p.ExitCode)"
          exit $p.ExitCode

      - name: Règles du pare-feu (MyVerse.exe --parefeu)
        run: |
          $p = Start-Process -FilePath "out\MyVerse\MyVerse.exe" -ArgumentList "--parefeu" -PassThru
          $null = $p.Handle
          if (-not $p.WaitForExit(120000)) { $p.Kill(); "délai dépassé" | Tee-Object -FilePath ci/autotest/autotest.txt -Append; exit 1 }
          "code de sortie : $($p.ExitCode)" | Tee-Object -FilePath ci/autotest/autotest.txt -Append
          foreach ($r in @("MyVerse (TCP)", "MyVerse (UDP)", "MyVerse (programme)")) {
            netsh advfirewall firewall show rule name="$r" | Select-Object -First 12 | Tee-Object -FilePath ci/autotest/autotest.txt -Append
            if ($LASTEXITCODE -ne 0) { "règle absente : $r" | Tee-Object -FilePath ci/autotest/autotest.txt -Append; exit 1 }
          }
          exit $p.ExitCode

      - name: Installateur (NSIS) et dossier portable
        if: success()
        run: |
          $V = "${{ steps.v.outputs.version }}"
          $nsis = "${env:ProgramFiles(x86)}\NSIS\makensis.exe"
          if (-not (Test-Path $nsis)) { choco install nsis -y --no-progress | Out-Null; $nsis = "${env:ProgramFiles(x86)}\NSIS\makensis.exe" }
          Remove-Item -Recurse -Force windows/installer/app -ErrorAction SilentlyContinue
          Copy-Item -Recurse out/MyVerse windows/installer/app
          Push-Location windows/installer
          & $nsis -V2 "-DVERSION=$V" MyVerse.nsi
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Pop-Location
          Move-Item windows/installer/MyVerse-Setup-*.exe .
          Compress-Archive -Path out/MyVerse -DestinationPath "MyVerse-$V-Windows.zip" -CompressionLevel Optimal
          Get-ChildItem MyVerse-*.zip, MyVerse-Setup-*.exe | Format-Table Name, Length

      - name: Test de l'installateur (mise à jour d'une 3.x, puis désinstallation)
        if: success()
        run: |
          $dir = "$env:LOCALAPPDATA\Programs\MyVerse"
          # une fausse MyVerse 3.x déjà installée (Neutralino + module réseau)
          New-Item -ItemType Directory -Force "$dir\extensions\bridge" | Out-Null
          Set-Content "$dir\resources.neu" "ancien"
          Set-Content "$dir\extensions\bridge\verselight-bridge.exe" "ancien"
          Set-Content "$dir\neutralinojs.log" "ancien"
          $setup = (Get-ChildItem MyVerse-Setup-*.exe | Select-Object -First 1).FullName
          $p = Start-Process $setup -ArgumentList "/S" -PassThru
          $null = $p.Handle
          if (-not $p.WaitForExit(240000)) { "installateur bloqué" | Tee-Object -FilePath ci/installateur.txt -Append; exit 1 }
          "installateur : code $($p.ExitCode)" | Tee-Object -FilePath ci/installateur.txt -Append
          Start-Sleep 4
          $ouvert = Get-Process MyVerse -ErrorAction SilentlyContinue
          "MyVerse rouvert après la mise à jour : $([bool]$ouvert)" | Tee-Object -FilePath ci/installateur.txt -Append
          $ouvert | Stop-Process -Force -ErrorAction SilentlyContinue
          $ok = $true
          foreach ($f in @("MyVerse.exe", "Ressources\lsg.json", "Ressources\obs\ecran.html", "Desinstaller.exe")) { $e = Test-Path "$dir\$f"; "présent $f : $e" | Tee-Object -FilePath ci/installateur.txt -Append; if (-not $e) { $ok = $false } }
          foreach ($f in @("resources.neu", "extensions", "neutralinojs.log")) { $e = Test-Path "$dir\$f"; "ancien $f retiré : $(-not $e)" | Tee-Object -FilePath ci/installateur.txt -Append; if ($e) { $ok = $false } }
          "raccourci Bureau : $(Test-Path "$env:USERPROFILE\Desktop\MyVerse.lnk")" | Tee-Object -FilePath ci/installateur.txt -Append
          "Applications installées : $((Get-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\MyVerse' -ErrorAction SilentlyContinue).DisplayVersion)" | Tee-Object -FilePath ci/installateur.txt -Append
          $u = Start-Process "$dir\Desinstaller.exe" -ArgumentList @("/S", "_?=$dir") -PassThru
          $null = $u.Handle
          $u.WaitForExit(120000) | Out-Null
          "désinstallé (MyVerse.exe supprimé) : $(-not (Test-Path "$dir\MyVerse.exe"))" | Tee-Object -FilePath ci/installateur.txt -Append
          if (Test-Path "$dir\MyVerse.exe") { $ok = $false }
          if (-not $ok) { exit 1 }

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: MyVerse-Setup-${{ steps.v.outputs.version }}
          path: MyVerse-Setup-*.exe

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: windows-zip
          path: |
            MyVerse-*-Windows.zip
            MyVerse-Setup-*.exe
          retention-days: 3

      - name: Journal Windows
        if: always()
        run: '"${{ job.status }}" | Out-File -Encoding utf8 ci/windows.status'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ci-windows
          path: ci
          retention-days: 3

  android:
    name: APK Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - uses: gradle/actions/setup-gradle@v4

      - name: Keystore de production (si les secrets existent)
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
            echo "Signature : keystore de production"
          else
            echo "Signature : keystore de debug du dépôt (secrets absents)"
          fi

      - name: Compilation des APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
        run: |
          export VERSION_NAME=$(tr -d '[:space:]' < ../VERSION)
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then export VERSION_NAME="${GITHUB_REF#refs/tags/v}"; fi
          chmod +x gradlew
          set -o pipefail
          ./gradlew --no-daemon assembleDebug assembleRelease 2>&1 | tee ../ci-android.log
          mkdir -p ../apk
          cp app/build/outputs/apk/release/app-release.apk ../apk/MyVerse.apk
          cp app/build/outputs/apk/debug/app-debug.apk ../apk/MyVerse-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: MyVerse
          path: apk/MyVerse.apk

      - uses: actions/upload-artifact@v4
        with:
          name: MyVerse-debug
          path: apk/MyVerse-debug.apk

      - name: Journal Android
        if: always()
        run: echo "${{ job.status }}" > ci-android.status
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ci-android-log
          path: |
            ci-android.log
            ci-android.status
          retention-days: 3

  report:
    name: Rapport (branche ci-logs)
    if: always() && github.event_name == 'push' && startsWith(github.ref, 'refs/heads/')
    needs: [windows, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ci-android-log
          path: /tmp/a
        continue-on-error: true
      - uses: actions/download-artifact@v4
        with:
          name: ci-windows
          path: /tmp/w
        continue-on-error: true
      - run: |
          { echo "commit ${GITHUB_SHA}"; echo "branche ${GITHUB_REF_NAME}"; echo "windows=${{ needs.windows.result }}"; echo "android=${{ needs.android.result }}"; } > /tmp/status.txt
          tail -c 60000 /tmp/a/ci-android.log > /tmp/android.log 2>/dev/null || echo "-" > /tmp/android.log
          git config user.name "github-actions"; git config user.email "actions@github.com"
          git checkout --orphan ci-logs && git rm -rqf .
          cp /tmp/status.txt status.txt && cp /tmp/android.log android.log
          if [ -d /tmp/w ]; then
            tail -c 60000 /tmp/w/tests.log > tests.log 2>/dev/null || true
            (grep -E "error|warning (CS|MC|NU|NETSDK)" /tmp/w/windows-build.log | sort -u | head -300 > windows-erreurs.log) 2>/dev/null || true
            tail -c 40000 /tmp/w/windows-build.log > windows.log 2>/dev/null || true
            cp /tmp/w/windows.status windows.status 2>/dev/null || true
            cp /tmp/w/installateur.txt installateur.txt 2>/dev/null || true
            if [ -d /tmp/w/autotest ]; then cp -r /tmp/w/autotest autotest; fi
          fi
          git add -A && git commit -qm "CI ${GITHUB_SHA}" && git push -f origin ci-logs

  release:
    name: Publication (GitHub Release)
    # la branche « dev » sert à vérifier la compilation : seules « main » et les tags publient une version
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: [windows, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dl
      - name: Publier la version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=$(tr -d '[:space:]' < VERSION)
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then V="${GITHUB_REF#refs/tags/v}"; fi
          TAG="v$V"
          FILES=(dl/windows-zip/*.zip dl/windows-zip/*.exe dl/MyVerse/MyVerse.apk dl/MyVerse-debug/MyVerse-debug.apk)
          ls -la "${FILES[@]}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${FILES[@]}" --clobber
          else
            gh release create "$TAG" "${FILES[@]}" --target "$GITHUB_SHA" --title "MyVerse $V" \
              --notes "MyVerse $V : logiciel Windows natif (installateur MyVerse-Setup, dossier portable) et APK Android (MyVerse.apk)."
          fi
